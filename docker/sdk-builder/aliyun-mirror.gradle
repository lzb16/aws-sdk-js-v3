// 阿里云 maven 镜像 + 坐标修正 —— 由 docker/sdk-builder 镜像注入到 $GRADLE_USER_HOME/init.d/
//
// 解决两件事(仅预热/联网时用到，运行期离线由 offline.gradle 接管)：
//  1) 此环境代理对 maven central 所有域名(repo.maven.apache.org / repo1.maven.org)返回 403，
//     把这些仓库 URL 强制替换为阿里云镜像(artifact 齐全、200)，并追加阿里云为后备。
//  2) codegen 依赖的 software.amazon.smithy:smithy-typescript-codegen:0.3.0 是 jcenter 旧坐标，
//     公网已无来源；该 artifact 迁移 central 后改为新坐标
//     software.amazon.smithy.typescript:smithy-typescript-codegen:0.3.0(阿里云有)，
//     用 dependencySubstitution 把旧坐标替换为新坐标。

import org.gradle.api.artifacts.repositories.MavenArtifactRepository

final String ALIYUN_PUBLIC = 'https://maven.aliyun.com/repository/public'
final String ALIYUN_PLUGIN = 'https://maven.aliyun.com/repository/gradle-plugin'

// 把 central / plugin-portal / jcenter 的仓库 URL 改写为阿里云
def rewrite = { repo, aliyunUrl ->
    if (repo instanceof MavenArtifactRepository) {
        def u = repo.url.toString()
        if (u.contains('repo.maven.apache.org') || u.contains('repo1.maven.org')
                || u.contains('jcenter') || u.contains('plugins.gradle.org')) {
            repo.url = aliyunUrl
        }
    }
}

settingsEvaluated { settings ->
    settings.pluginManagement {
        repositories {
            all { rewrite(it, ALIYUN_PLUGIN) }
            maven { url ALIYUN_PLUGIN }
            maven { url ALIYUN_PUBLIC }
        }
    }
}

allprojects {
    buildscript {
        repositories {
            all { rewrite(it, ALIYUN_PUBLIC) }
            maven { url ALIYUN_PLUGIN }
            maven { url ALIYUN_PUBLIC }
        }
    }
    repositories {
        // mavenLocal 优先：镜像里已从源码编译并安装了 jcenter 版
        // software.amazon.smithy:smithy-typescript-codegen:0.3.0(公网已无)
        mavenLocal()
        all { rewrite(it, ALIYUN_PUBLIC) }
        maven { url ALIYUN_PUBLIC }
    }
}

// sdk-codegen/build.gradle.kts 顶部的 buildscript{} 块硬编码 mavenCentral() 来解析 smithy-cli
// classpath；它在脚本编译期就解析(早于 allprojects.buildscript)，故用 beforeProject 提前注入阿里云。
gradle.beforeProject { project ->
    project.buildscript.repositories {
        maven { url ALIYUN_PLUGIN }
        maven { url ALIYUN_PUBLIC }
    }
}
